services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gea}
      POSTGRES_DB: ${POSTGRES_DB:-gea}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gea} -d ${POSTGRES_DB:-gea}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The production image (API + dashboard), for trying it locally:
  #   docker compose --profile app up --build     -> http://localhost:8080
  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gea}:${POSTGRES_PASSWORD:-gea}@db:5432/${POSTGRES_DB:-gea}
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
