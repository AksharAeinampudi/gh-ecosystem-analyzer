[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-ecosystem-analyzer"
version = "0.1.0"
description = "Language and topic momentum on GitHub, from GH Archive"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery>=3.25",
]
dev = [
    "httpx2>=2.16",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*", "ingest*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the docker-compose Postgres (skipped if unreachable)"]
