name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gea
          POSTGRES_PASSWORD: gea
          POSTGRES_DB: gea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gea -d gea"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The tests create and migrate their own gea_test database on this server.
      DATABASE_URL: postgresql://gea:gea@localhost:5432/gea
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # DB tests skip when Postgres is unreachable. A silent skip here would hide most of the
      # suite, so fail the job if anything was skipped.
      - name: pytest (no skips allowed)
        run: |
          pytest -rs | tee pytest.log
          ! grep -q "skipped" pytest.log

  frontend:
    name: Frontend (test, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gh-ecosystem-analyzer .
